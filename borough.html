<!DOCTYPE html>
<html>
    <head>
        <title>NYC Dog Name Borough Game</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
        <link href="styles.css" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css?family=Life+Savers:400,700" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css?family=Abril+Fatface" rel="stylesheet">
        <style>
            #borough-game { text-align: center; }

            #title-block {
                margin-bottom: 0.3em;
                padding: 0.2em 0;
            }
            #title-block h3 {
                font-size: 1.3em;
                margin-top: 0.2em;
                margin-bottom: -0.5em;
                padding-left: 6em;
            }
            #title-block h1 {
                font-size: 3.5em;
                line-height: 0.75em;
                margin-bottom: 0.3em;
                margin-top: 0;
            }
            #title-block .undertuck {
                font-size: 0.55em;
            }

            #borough-play h2 {
                font-size: 1.4em;
                margin: 0 0 0.1em 0;
            }

            #dog-name-display {
                font-family: 'Abril Fatface';
                font-size: 3em;
                margin: 0.1em 0;
                text-transform: capitalize;
            }

            /* Main layout: map area with bones to the right */
            #map-area {
                display: flex;
                justify-content: center;
                align-items: flex-start;
                max-width: 700px;
                margin: 0 auto;
            }

            #borough-map {
                flex: 1;
                max-width: 550px;
                margin: 0;
            }
            #borough-map svg {
                width: 100%;
                height: auto;
            }
            #borough-map path {
                fill: #d5d5d5;
                stroke: #fff;
                stroke-width: 2;
                cursor: pointer;
                transition: fill 0.2s;
            }
            #borough-map path:hover {
                fill: #a8c4b8;
            }
            #borough-map path.correct-borough {
                fill: #6c7ba5;
            }
            #borough-map path.wrong-borough {
                fill: rgba(161, 157, 138, 0.46);
            }
            #borough-map path.highlight-correct {
                fill: #6c7ba5;
                animation: pulse 0.6s ease-in-out 3;
            }
            @keyframes pulse {
                0%, 100% { fill: #6c7ba5; }
                50% { fill: #8fa0cc; }
            }
            #borough-map text {
                font-family: 'Life Savers';
                font-size: 14px;
                fill: #3a3a3a;
                pointer-events: none;
                font-weight: 700;
            }

            /* Bones column to the right of map */
            #borough-round {
                display: flex;
                flex-direction: column;
                align-items: center;
                margin-left: 0.5em;
                padding-top: 0.5em;
            }
            #borough-round .bone {
                display: block;
                font-size: 0.7em;
                line-height: 1;
            }

            /* Results bar above the map */
            #borough-results {
                margin: 0.2em 0;
            }
            #borough-result {
                font-size: 1.6em;
                margin: 0;
                display: inline;
            }
            #borough-result.correct { color: #6c7ba5; }
            #borough-result.wrong { color: rgba(161, 157, 138, 0.7); }

            #borough-detail {
                font-size: 1.1em;
                margin: 0.2em 0;
                font-family: 'Life Savers';
            }

            #borough-next-btn {
                font-family: 'Life Savers';
                font-size: 1.6em;
                background: none;
                border: none;
                color: #3a3a3a;
                cursor: pointer;
                width: auto;
                margin: 0 0 0 0.5em;
                display: inline;
            }
            #borough-next-btn:hover { color: #3d745c; }

            .borough-hidden { display: none; }

            #back-link {
                display: inline-block;
                margin-top: 0.5em;
                font-size: 1.2em;
                color: #3d745c;
                font-family: 'Life Savers';
            }
            #back-link:hover { color: #d5d5d5; }

            #final-results-borough {
                font-size: 1.2em;
            }
            #final-results-borough button {
                margin-top: 0;
            }

            @media screen and (max-width: 550px) {
                #title-block h1 { font-size: 2.8em; }
                #title-block h3 { padding-left: 4em; font-size: 1.1em; }
                #dog-name-display { font-size: 2.5em; }
                #borough-result { font-size: 1.3em; }
                #borough-next-btn { font-size: 1.3em; }
                #borough-map text { font-size: 11px; }
                #borough-round .bone { font-size: 0.6em; }
            }
        </style>
    </head>
